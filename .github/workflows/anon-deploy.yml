name: Anonymous Deployment

on:
  push:
    branches: [main, anon-workflow] # FIXME
  workflow_dispatch:

concurrency:
  group: anon-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build
    env:
      ANONYMOUS: "true"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # needed to use a recent version of yarn
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24 # current lts
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: yarn install --immutable

      - name: Install Python dependencies
        run: uv pip install --target src/lib/python -r pyproject.toml

      - name: Download Spec
        run: ./scripts/download-spec.sh

      - name: Build
        run: yarn build

      - name: Deploy to CF Pages
        uses: cloudflare/wrangler-action@v4
        with:
          command: deploy --name pldi-anon --assets build
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
