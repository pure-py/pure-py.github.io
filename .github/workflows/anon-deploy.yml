name: Anonymous Deployment

on:
  push:
    branches: [main, anon-workflow] # FIXME
  workflow_dispatch:

concurrency:
  group: anon-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build
    env:
      ANONYMOUS: "true"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Verify pure-py-spec is on a tag
        run: |
          git -C pure-py-spec fetch origin --tags --force

          TAG=$(git -C pure-py-spec tag --points-at HEAD)

          if [ -z "$TAG" ]; then
            echo "pure-py-spec is not checked out at an exact tag"
            exit 1
          fi

          echo "pure-py-spec is pinned to $TAG"

      # needed to use a recent version of yarn
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24 # current lts
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install
        run: yarn install --immutable

      - name: Download spec # FIXME(jacobpake)
        run: curl -L https://pure-py.github.io/pure-py-spec/v0.27.4/spec-anon.pdf -o static/spec.pdf

      - name: Build
        run: yarn build

      - name: Upload
        uses: cloudflare/wrangler-action@v4
        with:
          command: deploy --name pldi-anon --assets build
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
