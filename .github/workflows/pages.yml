name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch shallow submodule history
        run: git submodule update --init --recursive --depth 1

      - name: Verify pure-py-spec is on a tag
        run: |
          git -C pure-py-spec fetch origin --tags --force

          TAG=$(git -C pure-py-spec tag --points-at HEAD)

          if [ -z "$TAG" ]; then
            echo "pure-py-spec is not checked out at an exact tag"
            exit 1
          fi

          echo "pure-py-spec is pinned to $TAG"

      # needed to use a recent version of yarn
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24 # current lts
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
