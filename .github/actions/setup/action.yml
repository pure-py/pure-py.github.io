name: Setup and Check
description: Install dependencies and run checks

runs:
  using: composite
  steps:
    # needed to use a recent version of yarn
    - name: Enable corepack
      run: corepack enable
      shell: bash

    - uses: actions/setup-node@v6
      with:
        node-version: 24 # current lts
        cache: yarn
        cache-dependency-path: yarn.lock

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: true

    - name: Install Node dependencies
      run: yarn install --immutable
      shell: bash

    - name: Install Python dependencies
      run: uv pip install --target src/lib/python -r pyproject.toml
      shell: bash

    - name: Lint
      run: yarn run lint
      shell: bash

    - name: Check
      run: yarn run check
      shell: bash
